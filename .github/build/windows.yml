version: 2

env:
  - GO111MODULE=on

project_name: scan4all
builds:
  - id: scan4all-windows
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    binary: scan4all
    # Windows 上 pkg/naabu 的 pcap 实现被 build tag 排除（scan_unix.go: linux||darwin），
    # 因此无需 libpcap/mingw，关闭 cgo 即可原生编译，避免依赖 runner 上不存在的交叉编译器
    env:
      - CGO_ENABLED=0
    main: .
    goos:
      - windows
    goarch:
      - amd64
#      - arm64
#    extra_files:
#      - from: ../config
#        to: config
archives:
  - formats: [zip]
    files:
      - LICENSE*
      - README*
      - config/**/*

checksum:
  name_template: "{{ .ProjectName }}-windows-checksums.txt"
